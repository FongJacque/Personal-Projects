<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jacque Fong | Portfolio</title>
    <style>
        :root { 
            --bg: #f4efe8; 
            --card: #ffffff; 
            --text: #2c2520; 
            --primary: #0066cc; 
            --nav-bg: #1e293b; 
        }
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 0; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }
        
        nav { 
            background: var(--nav-bg); 
            padding: 1rem 2rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        nav a { color: white; text-decoration: none; font-weight: 600; margin-left: 1.5rem; }
        nav .brand { margin-left: 0; font-size: 1.25rem; color: #60a5fa; }
        
        .hero-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .hero { 
            max-width: 800px; 
            text-align: center; 
        }
        h1 { 
            font-size: 3.5rem; 
            margin: 0 0 1rem 0; 
            color: #1e1b18; 
        }
        p { 
            font-size: 1.35rem; 
            color: #54493f; 
            line-height: 1.6; 
            margin: 0 0 2rem 0;
        }
        .cta-btn { 
            display: inline-block; 
            background: var(--primary); 
            color: white; 
            padding: 0.85rem 1.75rem; 
            text-decoration: none; 
            border-radius: 0.5rem; 
            font-weight: bold; 
            transition: background 0.2s, transform 0.2s; 
        }
        .cta-btn:hover { 
            background: #004c99; 
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="brand">Jacque Fong</a>
        <div>
            <a href="/">Home</a>
            <a href="/about.html">About Me</a>
            <a href="/projects.html">Projects</a>
            <a href="/resume.html">Resume</a>
        </div>
    </nav>
    
    <div class="hero-container">
        <div class="hero">
            <h1>Hi, I'm Jacque Fong</h1>
            <p>Data Scientist & Engineer specializing in R, Python, and Computer Vision development.</p>
            <a href="/projects.html" class="cta-btn">View My Work</a>
        </div>
    </div>
</body>
</html>
