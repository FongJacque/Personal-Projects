<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Jacque Fong</title>
    <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
    <nav class="site-nav">
        <a href="/" class="brand">Jacque Fong</a>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/about.html">About Me</a></li>
            <li><a href="/projects.html" aria-current="page">Projects</a></li>
            <li><a href="/resume.html">Resume</a></li>
        </ul>
    </nav>

    <main class="container projects-page">
        <h1>Projects</h1>
        <p class="subtitle">Grouped by area, most recently updated first.</p>
        <div id="project-sections">
            <p class="loading">Loading projects…</p>
        </div>
    </main>

    <footer class="site-footer">© 2026 Jacque Fong</footer>

    <script>
    // ------------------------------------------------------------------
    // Builds the projects list from /assets/projects.json, then asks
    // GitHub when each project folder was last changed and sorts each
    // section newest-first. To add a project, edit projects.json only.
    // ------------------------------------------------------------------

    const CACHE_KEY = "project-dates-v1";
    const CACHE_MINUTES = 30;   // keeps us well under GitHub's 60 requests/hour limit

    // Last commit date for one folder (ISO string), or null if unavailable
    async function lastCommitDate(repo, path) {
        const url = `https://api.github.com/repos/${repo}/commits?path=${encodeURIComponent(path)}&per_page=1`;
        const res = await fetch(url);
        if (!res.ok) return null;
        const commits = await res.json();
        return commits.length ? commits[0].commit.committer.date : null;
    }

    // Newest date across a project's current folder and any old folder names
    async function projectDate(repo, project) {
        const paths = [project.path, ...(project.previousPaths || [])];
        const dates = await Promise.all(paths.map(p => lastCommitDate(repo, p).catch(() => null)));
        const valid = dates.filter(Boolean).sort();
        return valid.length ? valid[valid.length - 1] : null;
    }

    function readCache() {
        try {
            const saved = JSON.parse(sessionStorage.getItem(CACHE_KEY));
            if (saved && Date.now() - saved.time < CACHE_MINUTES * 60000) return saved.dates;
        } catch (e) { /* storage unavailable: just fetch again */ }
        return null;
    }

    function writeCache(dates) {
        try { sessionStorage.setItem(CACHE_KEY, JSON.stringify({ time: Date.now(), dates })); }
        catch (e) { /* ignore */ }
    }

    function timeAgo(iso) {
        const days = Math.floor((Date.now() - new Date(iso)) / 86400000);
        if (days < 1)  return "today";
        if (days < 2)  return "yesterday";
        if (days < 30) return `${days} days ago`;
        const months = Math.floor(days / 30);
        if (months < 12) return `${months} month${months > 1 ? "s" : ""} ago`;
        const years = Math.floor(days / 365);
        return `${years} year${years > 1 ? "s" : ""} ago`;
    }

    function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }

    function projectCard(project, date) {
        const updated = date
            ? `<time datetime="${date}" title="${new Date(date).toLocaleString()}">Updated ${timeAgo(date)}</time>`
            : "";
        const tags = (project.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join("");
        return `
            <li>
                <a class="card project-card" href="/project.html?id=${encodeURIComponent(project.id)}">
                    <div class="project-head">
                        <h3>${escapeHtml(project.name)}</h3>
                        ${updated}
                    </div>
                    <p>${escapeHtml(project.description)}</p>
                    <div class="tags">${tags}</div>
                </a>
            </li>`;
    }

    async function buildPage() {
        const container = document.getElementById("project-sections");
        try {
            const config = await (await fetch("/assets/projects.json")).json();

            let dates = readCache();
            if (!dates) {
                dates = {};
                await Promise.all(config.projects.map(async p => {
                    dates[p.id] = await projectDate(config.repo, p);
                }));
                if (Object.values(dates).some(Boolean)) writeCache(dates);
            }

            container.innerHTML = config.sections.map(section => {
                const items = config.projects
                    .filter(p => p.section === section.id)
                    .sort((a, b) => (dates[b.id] || "").localeCompare(dates[a.id] || ""));

                const body = items.length
                    ? `<ul class="project-list">${items.map(p => projectCard(p, dates[p.id])).join("")}</ul>`
                    : `<p class="coming-soon">Coming soon.</p>`;

                return `<section class="project-section"><h2>${escapeHtml(section.title)}</h2>${body}</section>`;
            }).join("");
        } catch (err) {
            container.innerHTML = `<p class="coming-soon">Projects couldn't load right now. You can browse them on
                <a href="https://github.com/FongJacque/Personal-Projects" target="_blank" rel="noopener">GitHub</a>.</p>`;
        }
    }

    buildPage();
    </script>
</body>
</html>
