<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume | Jacque Fong</title>
    <style>
        :root { 
            --bg-base: #e6dccf;
            --bg-streak: #dfd4c5;
            --text: #2d241e; 
            --primary: #8b5a2b; 
            --nav-bg: #2b231d; 
        }
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background: repeating-linear-gradient(90deg, var(--bg-base), var(--bg-base) 120px, var(--bg-streak) 121px, var(--bg-base) 122px, var(--bg-base) 240px);
            color: var(--text); 
            margin: 0; 
            padding: 0; 
        }
        nav { 
            background: var(--nav-bg); 
            padding: 1rem 2rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        nav a { color: #f4efe8; text-decoration: none; font-weight: 600; margin-left: 1.5rem; }
        nav .brand { margin-left: 0; font-size: 1.25rem; color: #dcb88f; }
        
        .container { max-width: 750px; margin: 40px auto; padding: 0 2rem; text-align: center; }
        h1 { color: #1a130e; margin-bottom: 0.5rem; }
        .subtitle { color: #5c4d41; margin-bottom: 2rem; font-size: 1.1rem; }
        
        .resume-link { 
            display: inline-block; 
            position: relative; 
            border-radius: 8px; 
            overflow: hidden; 
            box-shadow: 0 12px 30px rgba(45,36,30,0.15); 
            transition: transform 0.3s ease, box-shadow 0.3s ease; 
            text-decoration: none; 
        }
        .resume-link:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 18px 40px rgba(45,36,30,0.25); 
        }
        .resume-img { max-width: 100%; height: auto; display: block; border: 1px solid rgba(0,0,0,0.05); }
        
        .resume-link::after { 
            content: "⬇ Click to Download Uneditable PDF"; 
            position: absolute; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            background: rgba(139, 90, 43, 0.95); 
            color: white; 
            padding: 14px; 
            font-weight: bold; 
            font-size: 1rem; 
            opacity: 0; 
            transition: opacity 0.3s ease; 
        }
        .resume-link:hover::after { opacity: 1; }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="brand">Jacque Fong</a>
        <div>
            <a href="/">Home</a>
            <a href="/about.html">About Me</a>
            <a href="/projects.html">Projects</a>
            <a href="/resume.html">Resume</a>
        </div>
    </nav>
    
    <div class="container">
        <h1>My Professional Resume</h1>
        <p class="subtitle">Click the image below to instantly download the secure, uneditable PDF version.</p>
        
        <a href="/resume.pdf" download="Jacque_Fong_Resume.pdf" class="resume-link">
            <img src="/resume-preview.png" alt="Jacque Fong Resume Preview" class="resume-img">
        </a>
    </div>
</body>
</html>
